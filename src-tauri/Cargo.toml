# Boot OS Pro — Cargo.toml — build 1.0.2 — Monday 9 November 2026
[package]
name = "bootospro"
version = "1.0.2"
edition = "2021"
# Two binaries: the app, and the privileged helper (src/bin/bootospro-helper.rs).
default-run = "bootospro"

[lib]
name = "bootospro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tracing-subscriber = "0.3"
libc = "0.2"
